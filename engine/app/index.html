<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Kimmy v2 : écran épuré. Une photo, une ligne de texte. Zones sûres TikTok : rien d'important
     au-dessus de y=260 (onglets), sous y=1480 (description) ni à droite de x=950 (boutons). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0b0d;font-family:"Inter Display","Inter",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;left:-90px;top:-90px;width:1260px;height:2100px;background-size:cover;background-position:center;will-change:transform,opacity}
#veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,10,.45) 0%,rgba(8,8,10,.25) 35%,rgba(8,8,10,.62) 70%,rgba(8,8,10,.9) 100%)}
#flash{position:absolute;inset:0;background:#ff2d2d;opacity:0;mix-blend-mode:screen}
#heroWrap{position:absolute;left:70px;top:300px;width:880px;height:700px}
.hero{position:absolute;inset:0;border-radius:44px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6);will-change:transform;background:#111}
.hero .ph{position:absolute;inset:-6%;background-size:cover;will-change:transform}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.7) 100%)}
.hero .credit{position:absolute;right:24px;top:24px;font:500 17px "Inter";color:rgba(255,255,255,.6)}
/* single badge on the card: avatar + Kimmy + number */
#badge{position:absolute;left:96px;top:326px;z-index:5;height:72px;border-radius:36px;padding:0 24px 0 8px;display:flex;align-items:center;gap:14px;background:rgba(12,12,14,.55);font:700 28px "Inter Display"}
#ava{width:56px;height:56px;border-radius:50%;background:url(kimmy_ava.jpg) center/cover}
#roll{height:72px;overflow:hidden}
#rollIn div{height:72px;font:800 30px/72px "Inter Display";color:#fff;white-space:nowrap}
#rollIn div b{color:#ff3b3b}
/* headline on the card during the opening */
#headline{position:absolute;left:110px;top:760px;width:800px;z-index:6;font:900 92px/0.98 "Inter Display";letter-spacing:-3px;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#headline span{display:inline-block;will-change:transform,opacity}
#stamp{position:absolute;left:110px;top:430px;z-index:7;transform-origin:left center;font:900 78px "Inter Display";letter-spacing:-1.5px;padding:14px 30px 18px;border-radius:24px;background:#ff3b3b;color:#fff;box-shadow:0 18px 40px rgba(255,40,40,.4);white-space:nowrap;opacity:0}
/* one caption line at a time */
#cap{position:absolute;left:70px;top:1060px;width:860px;height:400px;display:flex;align-items:center}
.ln{position:absolute;left:0;width:860px;font:900 74px/1.06 "Inter Display";letter-spacing:-2px;will-change:transform,opacity;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.ln span{display:inline-block;white-space:pre;will-change:transform}
/* outro */
#outro{position:absolute;left:70px;top:300px;width:880px;height:700px}
.oc{position:absolute;top:40px;width:272px;height:520px;border-radius:36px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55);opacity:0;will-change:transform,opacity}
.oc div.im{position:absolute;inset:0;background-size:cover}
.oc .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.82) 100%)}
.oc .nb{position:absolute;left:20px;top:14px;font:900 96px "Inter Display";letter-spacing:-3px;text-shadow:0 6px 24px rgba(0,0,0,.6)}
.oc .tt{position:absolute;left:20px;right:12px;bottom:22px;font:800 32px/1.05 "Inter Display";letter-spacing:-.8px}
</style></head><body>
<div id="stage">
  <div id="bgs"></div><div id="veil"></div><div id="flash"></div>
  <div id="heroWrap"></div>
  <div id="outro"></div>
  <div id="badge"><div id="ava"></div><div id="roll"><div id="rollIn"></div></div></div>
  <div id="headline"></div>
  <div id="stamp"></div>
  <div id="cap"></div>
</div>
<script>
const $=s=>document.querySelector(s), cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ss=x=>{x=cl(x);return x*x*(3-2*x)}, eo=x=>1-Math.pow(1-cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=cl(x);const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const spring=x=>{x=cl(x);return 1-Math.exp(-6.5*x)*Math.cos(9*x)};
const mix=(a,b,k)=>a+(b-a)*k;
let D;
async function init(){
  D=await (await fetch('data.json')).json();
  D.tracks.forEach((t,i)=>{
    const b=document.createElement('div');b.className='bg';b.style.backgroundImage=`url(${t.img}_bg.jpg)`;$('#bgs').appendChild(b);t.bg=b;
    const h=document.createElement('div');h.className='hero';h.innerHTML=`<div class="ph" style="background-image:url(${t.img}.jpg);background-position:${t.pos}"></div><div class="shade"></div><div class="credit">${t.credit||''}</div>`;$('#heroWrap').appendChild(h);t.hero=h;t.ph=h.firstChild;
    const r=document.createElement('div');r.innerHTML=t.intro?'Kimmy · <b>Top 3</b>':`Kimmy · <b>N° ${t.n}</b>`;$('#rollIn').appendChild(r);
    if(t.intro){t.oc=document.createElement('div');}else{const o=document.createElement('div');o.className='oc';o.style.left=((i-1)*304)+'px';o.innerHTML=`<div class="im" style="background-image:url(${t.img}.jpg);background-position:${t.pos}"></div><div class="sh"></div><div class="nb">${t.n}</div><div class="tt">${t.title}</div>`;$('#outro').appendChild(o);t.oc=o;}
  });
  const hl=D.tracks[0].headline||'';$('#headline').innerHTML=hl.split(' ').map(w=>`<span>${w}</span>`).join(' ');
  D.lines.forEach(l=>{const d=document.createElement('div');d.className='ln';
    d.innerHTML=l.words.map((w,i)=>`<span>${w.w}${i<l.words.length-1?' ':''}</span>`).join('');$('#cap').appendChild(d);l.el=d;l.sp=[...d.children];});
  await document.fonts.ready;
  D.lines.forEach(l=>{l.h=l.el.offsetHeight;l.el.style.top=(200-l.h/2)+'px'});
  D.outroStart=(D.lines.find(l=>l.outro)||{start:1e9}).start;
  window.ready=true;
}
function noise(t,s){return Math.sin(t*37.1+s)*.6+Math.sin(t*61.7+s*2.3)*.4}
window.setTime=function(t){
  const T=D.tracks,L=D.lines;
  let ci=0;T.forEach((k,i)=>{if(t>=k.start)ci=i});
  const TR=.7,p=ci>0?cl((t-T[ci].start)/TR):1;
  let sh=0;L.forEach(l=>{if(l.shout&&t>=l.start-.03&&t<l.end+.3){sh=Math.max(sh,1-cl((t-l.start)/(l.end-l.start+.3))*.75)}});
  const out=cl((t-D.outroStart)/.6);
  T.forEach((k,i)=>{let o=0;if(i==ci)o=ci==0?1:ss(p);else if(i==ci-1)o=1-ss(p);
    k.bg.style.opacity=o;const d=t*.02+i;k.bg.style.transform=`translate(${Math.sin(d*1.3)*40}px,${Math.cos(d)*40}px) scale(${1.04+.03*Math.sin(d*.7)})`;});
  $('#flash').style.opacity=sh*.14*(0.6+.4*Math.abs(noise(t,1)));
  const shx=sh*noise(t,3)*8,shy=sh*noise(t,7)*6;
  T.forEach((k,i)=>{const h=k.hero;let x=0,r=0,s=1,o=1;
    if(i==ci){if(ci>0){const e=spring(p*1.05);x=(1-e)*1100;r=(1-e)*7;s=mix(.9,1,eo(p))}
      if(ci==0){s*=mix(1.08,1,eo(cl(t/.5)));o=1}}
    else if(i==ci-1){const e=eio(cl(p*1.5));x=-e*1150;r=-e*8;s=1-.12*e;o=1-cl((p-.6)*4)}
    else o=0;
    s*=1+sh*.02;o*=1-out;
    h.style.opacity=o;h.style.transform=`translate(${x+shx}px,${shy-out*60}px) rotate(${r}deg) scale(${s})`;
    const lt=cl((t-k.start)/((T[i+1]?T[i+1].start:D.total)-k.start));
    k.ph.style.transform=`scale(${1.05+.14*lt}) translate(${mix(-1.2,1.2,lt)}%,${mix(.8,-.8,lt)}%)`;});
  // badge
  $('#rollIn').style.transform=`translateY(${-72*(ci>0?ci-1+spring(p*1.1):0)}px)`;
  $('#badge').style.opacity=(1-out)*cl((t-.25)/.2);$('#badge').style.transform=`scale(${1+.12*Math.sin(Math.PI*cl(p*1.4))*(ci>0?1:0)})`;
  // headline: visible from frame 0 during the opening, slides away at first track change
  const hs=[...$('#headline').children],hEnd=T[1]?T[1].start:1e9;
  hs.forEach((c,j)=>{const gone=eio(cl((t-(hEnd-.5))/.4)),pulse=1+.04*Math.exp(-t*3)*Math.sin(t*14+j);
    c.style.opacity=1-gone;c.style.transform=`translateY(${-gone*60}px) scale(${pulse})`;});
  // stamp
  let st=null;L.forEach(l=>{if(l.stamp&&l.track==ci&&t>=(l.instant?l.start+.05:l.end-.35)&&t<l.end+(l.instant?1.0:1.8))st=l});
  const se=$('#stamp');
  if(st&&!out){const a=t-(st.instant?st.start+.05:st.end-.35),k=cl(a/.2),o=1-cl((a-(st.instant?1.0:1.8)+.25)/.25);
    if(se.dataset.s!=st.stamp){se.dataset.s=st.stamp;se.textContent=st.stamp}
    se.style.opacity=cl(k*3)*cl(o);se.style.transform=`rotate(${-4+2*Math.exp(-a*5)*Math.sin(a*30)}deg) scale(${mix(2.2,1,eo(k))})`;
  } else se.style.opacity=0;
  // caption: one line at a time
  let ai=0;L.forEach((l,i)=>{if(t>=l.start-.08)ai=i});
  L.forEach((l,i)=>{
    if(i!=ai&&i!=ai-1){l.el.style.opacity=0;return}
    const a=i==ai?cl((t-(l.start-.08))/.22):0, leave=i==ai-1?cl((t-(L[ai].start-.08))/.18):0;
    let o=i==ai?(i==0?1:ss(a)):1-leave, y=i==ai?(1-eo(a))*50:-leave*40, sc=i==ai?mix(.94,1,eo(a)):1;
    if(l.shout&&i==ai){sc*=1.02+.012*noise(t,5)}
    l.el.style.opacity=o;l.el.style.transform=`translate(${l.shout&&i==ai?noise(t,11)*4:0}px,${y}px) scale(${sc})`;
    l.sp.forEach((s,j)=>{const w=l.words[j];const k=i<ai?1:cl((t-w.s+.04)/.12);
      const col=l.shout?`rgb(255,${mix(255,59,k)|0},${mix(255,59,k)|0})`:'#fff';
      s.style.color=col;s.style.opacity=mix(.35,1,k);
      const pop=Math.sin(Math.PI*cl((t-w.s+.04)/.24));s.style.transform=`translateY(${-6*pop}px) scale(${1+.06*pop})`;});
  });
  T.forEach((k,i)=>{const a=t-D.outroStart-.18-(i-1)*.14;const e=spring(cl(a/.7));
    k.oc.style.opacity=cl(a/.15);k.oc.style.transform=`translateY(${(1-e)*240}px) rotate(${(i-2)*2.5*e}deg) scale(${mix(.8,1,eo(cl(a/.5)))})`;});
};
init();
</script></body></html>
